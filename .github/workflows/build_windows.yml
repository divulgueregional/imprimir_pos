name: Compilar DRSystema Print (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # necessário para publicar o Release "latest"

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fixado em 3.47.8: o nativeapi (dep do tray_manager/window_manager)
          # usa Isolate.create, removido do Dart 3.14 (Flutter 3.50.x).
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Diagnóstico do Ambiente
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Instalar dependências
        run: flutter pub get

      # O plugin jni (transitivo via shared_preferences_android) tem um bug no
      # src/CMakeLists.txt: usa ${TARGET_NAME} indefinido no bloco WIN32.
      # No runner do GitHub ha JDK pre-instalado, entao find_package(JNI) tem
      # sucesso e o bloco quebrado e executado, falhando o cmake.
      - name: Corrigir CMake do plugin jni (bug upstream)
        shell: pwsh
        run: |
          $files = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev\jni-*\src\CMakeLists.txt" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            (Get-Content $f.FullName -Raw) -replace '\$\{TARGET_NAME\}', 'jni' | Set-Content $f.FullName -NoNewline
            Write-Host "Patched $($f.FullName)"
          }

      - name: Executar testes unitários
        run: flutter test

      - name: Compilar executável para Windows (Release)
        run: flutter build windows --release -v

      - name: Compactar build em ZIP
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath drsystema_print_windows.zip

      - name: Salvar artefato para download
        uses: actions/upload-artifact@v4
        with:
          name: drsystema-print-windows
          path: drsystema_print_windows.zip

      # Gera DRSystemaPrintSetup.exe com o Inno Setup (pre-instalado no runner;
      # fallback via Chocolatey se a imagem mudar).
      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc installer\drsystema_print_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Salvar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: drsystema-print-setup
          path: installer_output\DRSystemaPrintSetup.exe

      # Publica o instalador num Release "latest" contínuo — download público
      # sem login em: .../releases/latest/download/DRSystemaPrintSetup.exe
      - name: Publicar instalador no Release público
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "DRSystema Print — Última versão"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: installer_output/DRSystemaPrintSetup.exe
